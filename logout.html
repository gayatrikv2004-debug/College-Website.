<!DOCTYPE html>
<html>
<head>
  <title>Logout Page</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(to right, #4facfe, #00f2fe);
      font-family: Arial, sans-serif;
    }

    .box {
      text-align: center;
      background: white;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 0 15px rgba(0,0,0,0.2);
    }

    button {
      padding: 10px 20px;
      border: none;
      background: #ff4d4d;
      color: white;
      font-size: 16px;
      border-radius: 6px;
      cursor: pointer;
    }

    button:hover {
      background: #e60000;
    }
  </style>

</head>

<body>

  <div class="box">
    <h2>You have been logged out</h2>
    <button onclick="goLogin()">Go to Login</button>
  </div>

  <script>
    function goLogin() {
      window.location.href = "login.html";
    }
  </script>

</body>
</html>
