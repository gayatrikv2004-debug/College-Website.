<!DOCTYPE html>
<html>
<head>
  <title>Thank You</title>

  <style>
    /* Animated background */
    body {
      margin: 0;
      font-family: Arial;

      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;

      background: linear-gradient(-45deg, #ff512f, #dd2476, #24c6dc, #514a9d);
      background-size: 400% 400%;
      animation: bg 8s ease infinite;
    }

    @keyframes bg {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Glass card */
    .box {
      text-align: center;
      padding: 45px;
      width: 320px;

      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);

      border-radius: 15px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.3);
      color: white;

      animation: pop 0.8s ease;
    }

    @keyframes pop {
      from {
        transform: scale(0.5);
        opacity: 0;
      }
      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    h1 {
      font-size: 40px;
      margin-bottom: 10px;
    }

    p {
      font-size: 16px;
      margin-bottom: 20px;
    }

    .btn {
      background: white;
      color: black;
      padding: 10px 25px;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.3s;
    }

    .btn:hover {
      background: black;
      color: white;
      transform: scale(1.1);
    }

  </style>
</head>

<body>

  <div class="box">
    <h1>🎉 Thank You!</h1>
    <p>Your registration is successfully completed.</p>

    <button class="btn" onclick="goHome()">Go Home</button>
  </div>

  <script>
    function goHome() {
      window.location.href = "index.html";
    }
  </script>

</body>
</html>
